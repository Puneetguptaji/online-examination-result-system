<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff;}

<body>

  <line x1="178" y1="126" x2="292" y2="126" stroke="#222" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="294" y="258" width="308" height="66" rx="11" fill="#fff4ec" stroke="#b45309" stroke-width="1.8"/>

  <text x="448" y="305" font-size="12" text-anchor="middle" fill="#333">trg_results_ai / au / ad</text>

  <line x1="602" y1="290" x2="648" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#arw)"/>

  <path d="M652 324 L858 324" stroke="#222" stroke-width="1.8"/>

  <rect x="294" y="338" width="308" height="66" rx="11" fill="#f2fff6" stroke="#15803d" stroke-width="1.8"/>
  <text x="448" y="364" font-size="15" text-anchor="middle" font-weight="bold">P4  v_result_summary</text>

  <line x1="448" y1="404" x2="448" y2="416" stroke="#222" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="294" y="418" width="308" height="60" rx="11" fill="#f2f5ff" stroke="#1e40af" stroke-width="1.8"/>

  <line x1="448" y1="478" x2="448" y2="490" stroke="#222" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="294" y="492" width="308" height="66" rx="11" fill="#f2f5ff" stroke="#1e40af" stroke-width="1.8"/>

  <line x1="448" y1="558" x2="448" y2="570" stroke="#222" stroke-width="1.5" marker-end="url(#arw)"/>

  <line x1="16" y1="648" x2="864" y2="648" stroke="#dcdcdc" stroke-width="1.2"/>

  <rect x="66" y="663" width="36" height="19" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="110" y="677" font-size="12" fill="#333">entity</text>

  <rect x="178" y="663" width="36" height="19" rx="7" fill="#f2f5ff" stroke="#1e40af" stroke-width="1.5"/>

  <path d="M306 679 L344 679" stroke="#222" stroke-width="1.7"/>
